name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make build test
      - run: go vet ./...
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd api internal hack)"
      - name: Check standalone toy module
        working-directory: hack/toy-mcp-server
        run: go test ./...

  kind:
    name: Authenticated Kubernetes MCP and network isolation
    needs: go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned kind and kubectl
        env:
          KIND_VERSION: v0.33.0
          KUBECTL_VERSION: v1.35.8
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64.sha256sum"
          # The release checksum names kind-linux-amd64.
          mv kind kind-linux-amd64
          sha256sum --check kind.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - run: make e2e
      - name: Upload demo and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kind-demo
          path: artifacts/e2e.*/logs/
          retention-days: 7
          if-no-files-found: warn
