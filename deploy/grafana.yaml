# Minimal Grafana for local dev/demo — no persistence, anonymous access.
# Provisioned via ConfigMaps: Prometheus datasource + one portkeeper
# dashboard (HTTP traffic and instrumented backend executions). Not for production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: portkeeper
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  portkeeper.json: |
    {
      "uid": "portkeeper",
      "title": "Portkeeper Gateway",
      "timezone": "browser",
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Gateway HTTP request rate",
          "description": "Finished HTTP requests including MCP control messages, rejections and streams. Not tool executions.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, server, endpoint) (rate(mcp_gateway_http_requests_total[1m]))",
              "legendFormat": "{{namespace}} / {{server}} / {{endpoint}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP request lifetime (p50 / p95 / p99)",
          "description": "Includes authentication and the entire lifetime of long-lived streams; not per-tool latency.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(mcp_gateway_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(mcp_gateway_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(mcp_gateway_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP error/aborted request rate (%)",
          "description": "Counts non-2xx responses or aborted streams, including streams that already sent HTTP 200.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(mcp_gateway_http_requests_total{status!~\"2..\"}[5m]) or rate(mcp_gateway_http_requests_total{result=\"aborted\"}[5m])) or vector(0)) / sum(rate(mcp_gateway_http_requests_total[5m]))",
              "legendFormat": "HTTP errors / aborted %"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Active gateway HTTP requests / streams",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(mcp_gateway_http_requests_in_flight)", "legendFormat": "active HTTP handlers" }]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend MCP tool executions",
          "description": "Instrumented backend handler executions only. Third-party servers must export their own execution metrics.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [{ "refId": "A", "expr": "sum by (tool, outcome) (rate(mcp_backend_tool_invocations_total[1m]))", "legendFormat": "{{tool}} / {{outcome}}" }]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Backend execution duration (p95)",
          "description": "Handler execution time, excluding gateway authentication and network latency.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, tool) (rate(mcp_backend_tool_duration_seconds_bucket[5m])))", "legendFormat": "{{tool}}" }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 2
            initialDelaySeconds: 5
          env:
            # Demo-only: skip login entirely.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
