apiVersion: v1
kind: ServiceAccount
metadata:
  name: portkeeper-controller
  namespace: portkeeper-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: portkeeper-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portkeeper-controller
subjects:
  - kind: ServiceAccount
    name: portkeeper-controller
    namespace: portkeeper-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portkeeper-controller-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portkeeper-gateway
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: portkeeper-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portkeeper-gateway-role
