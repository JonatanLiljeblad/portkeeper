apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-demo-client
  namespace: portkeeper-demo
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-denied-client
  namespace: portkeeper-demo
automountServiceAccountToken: false
---
# Allowed on the runbooks server, but only for the read_runbook tool.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-readonly-client
  namespace: portkeeper-demo
automountServiceAccountToken: false
---
# The incident agent: may read runbooks, inspect and restart, but not scale.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-incident-agent
  namespace: portkeeper-demo
automountServiceAccountToken: false
---
# Identity of the ops MCP backend pod. The controller mounts its token because
# the MCPServer names it; the Role below is everything it can do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-mcp
  namespace: portkeeper-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-mcp-checkout
  namespace: portkeeper-sandbox
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["checkout"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-mcp-checkout
  namespace: portkeeper-sandbox
subjects:
  - kind: ServiceAccount
    name: ops-mcp
    namespace: portkeeper-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-mcp-checkout
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portkeeper-controller
  namespace: portkeeper-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: portkeeper-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portkeeper-controller
subjects:
  - kind: ServiceAccount
    name: portkeeper-controller
    namespace: portkeeper-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portkeeper-controller-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portkeeper-gateway
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: portkeeper-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portkeeper-gateway-role
