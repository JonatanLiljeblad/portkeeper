apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-demo-client
  namespace: portkeeper-demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: mcp-demo-client
      automountServiceAccountToken: false
      volumes:
        - name: gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: portkeeper
                  expirationSeconds: 600
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: portkeeper/demo-client:e2e
          imagePullPolicy: IfNotPresent
          args:
            - -endpoint=http://mcp-gateway.portkeeper-system.svc.cluster.local:8080/portkeeper-demo/runbooks/mcp
            - -token-file=/var/run/portkeeper/token
            - -topic=gateway-routing
          volumeMounts:
            - name: gateway-token
              mountPath: /var/run/portkeeper
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
