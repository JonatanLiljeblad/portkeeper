kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  # Calico takes its pool from this value. It must not overlap the Docker
  # host gateway (192.168.65.0/24 on Docker Desktop), or pods cannot reach
  # host.docker.internal: Calico would treat the host as a pod address.
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
