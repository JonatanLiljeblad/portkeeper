apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portkeeper-controller-role
rules:
  - apiGroups: ["mcp.portkeeper.dev"]
    resources: ["mcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["mcp.portkeeper.dev"]
    resources: ["mcpservers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# The gateway reads the registry and validates tokens; it cannot read Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portkeeper-gateway-role
rules:
  - apiGroups: ["mcp.portkeeper.dev"]
    resources: ["mcpservers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
